<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CLOVER — Delhi NCR & Greater Noida Atmospheric & Air Quality Forecasting Engine with Coupled CML Microwave Sensing.">
  <title>CLOVER // Greater Noida Weather & Air Quality Index</title>
  
  <!-- Tailwind CSS CDN with configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            aqi: {
              good: '#22c55e',
              satisfactory: '#84cc16',
              moderate: '#eab308',
              poor: '#f97316',
              verypoor: '#ef4444',
              severe: '#dc2626'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- GSAP Animation Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- Lenis Smooth Scroll -->
  <script src="https://unpkg.com/lenis@1.1.9/dist/lenis.min.js"></script>

  <!-- React 18 and ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for runtime JSX transpilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="text-slate-800 min-h-screen antialiased selection:bg-sky-200 selection:text-sky-900">
  <div id="root"></div>

  <!-- Scripts -->
  <script src="src/delhiData.js"></script>
  <script src="src/cmlPhysics.js"></script>
  <script src="src/forecastingModel.js"></script>
  <script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
