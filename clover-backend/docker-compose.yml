services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
  api:
    build: .
    environment: { MONGODB_URI: mongodb://mongo:27017/clover, PREDICTION_SERVICE_URL: http://ml:8000 }
    ports: ["4000:4000"]
    depends_on: [mongo, ml]
  ml:
    build: ./ml-service
    ports: ["8000:8000"]
volumes: { mongo_data: {} }
